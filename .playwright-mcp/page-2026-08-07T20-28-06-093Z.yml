          - heading "Pins" [level=3] [ref=e59]
          - paragraph [ref=e60]: Places that stay put. Bathrooms, food, pharmacies, study spaces, charging points. Each one can carry the building, the floor and how to actually get in — the door code, which entrance, what to say at the desk.
        - generic [ref=e61]:
          - generic [ref=e62]: 🚩
          - heading "Reports" [level=3] [ref=e63]
          - paragraph [ref=e64]: What's true right now. A lift out of service, a flooded path, a kitchen that's stopped serving, a queue worth avoiding. Reports expire on their own, which is what keeps the map honest.
        - generic [ref=e65]:
