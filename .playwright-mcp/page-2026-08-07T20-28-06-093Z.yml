        - paragraph [ref=e77]: Why it stays true
        - heading "Everything temporary is treated as temporary." [level=2] [ref=e78]
        - paragraph [ref=e79]: The reason community maps rot is that nobody goes back to delete things. So on Cite, a report is born with an expiry that matches how long it could plausibly still be true — and when it lapses, it leaves.
