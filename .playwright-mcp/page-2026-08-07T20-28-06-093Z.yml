          - heading "Events" [level=3] [ref=e67]
          - paragraph [ref=e68]: Anything happening at a place and a time — a study session, a society night, a pickup game. RSVP, see who's coming, and find it again in your activity when it's about to start.
        - generic [ref=e69]:
