        - paragraph [ref=f2e119]: Why it stays true
        - heading "Nobody comes back to delete things." [level=2] [ref=f2e120]
        - paragraph [ref=f2e121]: That's how every community map rots. So on Cite nothing temporary has to be cleaned up by hand — a report is filed with a lifespan matched to how long it could plausibly still be true, and when that runs out it leaves on its own. Replies extend it. Silence doesn't.
        - paragraph [ref=f2e122]:
          - text: Pins are permanent, so they get asked instead. Every pin carries one question —
          - emphasis [ref=f2e123]: is this still accurate?
          - text: — and two taps to answer it.
